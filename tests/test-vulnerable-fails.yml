name: Test vulnerable code fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Place vulnerable source inside the workspace root module
        run: |
          # gosec (image 2.29) resolves packages from the CWD's module, so a nested
          # module (with its own go.mod) is skipped and 0 files are scanned. Copy
          # only the Go source into a directory governed by the root go.mod.
          rm -f "$GITHUB_WORKSPACE/go.work"
          rm -rf "$GITHUB_WORKSPACE/gosecscanfail"
          mkdir -p "$GITHUB_WORKSPACE/gosecscanfail"
          cp "$GITHUB_WORKSPACE/tests/fixtures/vulnerable/main.go" "$GITHUB_WORKSPACE/gosecscanfail/main.go"
          ls -la "$GITHUB_WORKSPACE/gosecscanfail"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GOWORK: "off"
        with:
          args: "-fmt json -out gosec-fails.json ./gosecscanfail/..."
      - name: Assert step failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          f="$GITHUB_WORKSPACE/gosec-fails.json"
          if [ -f "$f" ]; then cat "$f"; fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome for vulnerable code"
            exit 1
          fi
          if [ ! -f "$f" ] || ! grep -qE '"G401"|"G501"' "$f"; then
            echo "FAIL: expected G401/G501 finding in report"
            exit 1
          fi
          echo "PASS"
