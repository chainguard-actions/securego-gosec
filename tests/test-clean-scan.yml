name: Test gosec scan clean Go code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean Go file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("Hello, World!")
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/go.mod" << 'EOF'
          module example.com/clean

          go 1.21
          EOF
      - name: Run gosec on clean Go code
        id: action
        uses: .
        with:
          args: "./tests/fixtures/clean/..."
      - name: Assert scan completed successfully
        run: |
          echo "PASS: gosec scan of clean code completed successfully"
