name: Test basic usage (help flag)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gosec with help flag
        id: action
        uses: .
        with:
          args: "-h"
        continue-on-error: true
      - name: Assert action ran (help flag exits non-zero but prints usage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # gosec -h prints help and exits with code 0 or non-zero depending on version
          # Either success or failure is acceptable as long as the container ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: gosec container ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
