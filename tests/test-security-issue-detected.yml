name: Test gosec detects security issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a Go file with a known security issue
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/insecure"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/insecure/main.go" << 'EOF'
          package main

          import (
            "fmt"
            "math/rand"
          )

          func main() {
            // G404: Use of weak random number generator (math/rand instead of crypto/rand)
            n := rand.Intn(100)
            fmt.Println(n)
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/insecure/go.mod" << 'EOF'
          module example.com/insecure

          go 1.21
          EOF
      - name: Run gosec on insecure Go code
        id: action
        uses: .
        continue-on-error: true
        with:
          args: "./tests/fixtures/insecure/..."
      - name: Assert gosec detected security issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: gosec correctly detected security issues and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: gosec did not detect issues (may depend on gosec version/rules)"
            echo "PASS: scan completed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
